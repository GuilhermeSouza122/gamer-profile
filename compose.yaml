services:
  postgres:
    image: postgres:17-alpine
    container_name: gamer-profile-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamer_profile
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - gamer_profile_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d gamer_profile"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gamer_profile_postgres_data:
